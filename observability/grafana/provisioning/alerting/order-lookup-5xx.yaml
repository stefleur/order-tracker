apiVersion: 1

groups:
  - orgId: 1
    name: order-lookup
    folder: Order Tracker Alerts
    interval: 30s
    rules:
      - uid: order-lookup-5xx
        title: Order lookup HTTP 5xx
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                sum by (http_route) (increase(order_lookup_requests_total{http_response_status_code=~"5.."}[5m]))
                or on (http_route) (0 * sum by (http_route) (order_lookup_requests_total))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        dashboardUid: order-tracker
        panelId: 1
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'HTTP 5xx on {{ $labels.http_route }}'
          description: 'One or more 5xx responses on {{ $labels.http_route }} in the last 5 minutes.'
          dashboard: http://localhost:3000/d/order-tracker/order-tracker-requests
        notification_settings:
          receiver: Order Tracker Responder
          group_wait: 5s
          group_interval: 1m
          repeat_interval: 1h
        isPaused: false

contactPoints:
  - orgId: 1
    name: Order Tracker Responder
    receivers:
      - uid: order-responder-webhook
        type: webhook
        settings:
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST
